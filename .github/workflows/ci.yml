name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftLint --strict)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/swiftlint
          key: ${{ runner.os }}-brew-swiftlint-${{ hashFiles('Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-swiftlint-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --strict

  build-and-test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/swiftformat
          key: ${{ runner.os }}-brew-build-${{ hashFiles('Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-build-

      - name: brew bundle
        run: brew bundle

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme LifeView \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build test
