name: LifeView
options:
  bundleIdPrefix: fr.andreadelre
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.39.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig


packages:
  Core:
    path: Packages/Core
  GoogleAuth:
    path: Packages/GoogleAuth
  GoogleTasksClient:
    path: Packages/GoogleTasksClient
  DesignSystem:
    path: Packages/DesignSystem
  OfflineCache:
    path: Packages/OfflineCache

targets:
  LifeView:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LifeView
        excludes:
          - "LifeView.entitlements"
          - "Info.plist"
    # Info.plist is generated by XcodeGen from the `info` block below (not
    # tracked in git — mirrors the `.xcodeproj` policy). The CFBundleURLTypes
    # entry registers the reverse client-ID URL scheme required by
    # GoogleSignIn-iOS for the ASWebAuthenticationSession callback.
    info:
      path: LifeView/Info.plist
      properties:
        CFBundleDisplayName: LifeView
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Andrea Delre"
        NSPrincipalClass: NSApplication
        LSUIElement: true
        GIDClientID: 4449234021-spk533ucl7phqd625m9s04g1oa5j34cu.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.4449234021-spk533ucl7phqd625m9s04g1oa5j34cu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.andreadelre.LifeView
        PRODUCT_NAME: LifeView
        CODE_SIGN_ENTITLEMENTS: LifeView/LifeView.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Core
      - package: GoogleAuth
      - package: GoogleTasksClient
      - package: DesignSystem
      - package: OfflineCache
    scheme:
      testTargets:
        - LifeViewTests
        - package: Core/CoreTests
        - package: GoogleAuth/GoogleAuthTests
        - package: GoogleTasksClient/GoogleTasksClientTests
        - package: DesignSystem/DesignSystemTests
        - package: OfflineCache/OfflineCacheTests
      # Coverage temporarily disabled: turning it on instruments the
      # test target with `__llvm_profile_runtime` calls that aren't
      # resolved against SPM-built framework dependencies (LifeViewTests
      # links many). Re-enable when we move to a uniform coverage
      # strategy across SPM packages.
      gatherCoverageData: false

  LifeViewTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LifeViewTests
    dependencies:
      - target: LifeView
    settings:
      base:
        PRODUCT_NAME: LifeViewTests
        PRODUCT_BUNDLE_IDENTIFIER: fr.andreadelre.LifeViewTests
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
